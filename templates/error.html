<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ code }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="glass-card error-card">
    <div class="error-code">{{ code }}</div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-text">{{ text }}</p>
    {% if detail %}<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;text-align:left;background:rgba(0,0,0,.35);padding:10px;border-radius:10px;margin:12px 0;">{{ detail }}</pre>{% endif %}
    <div class="error-actions">
      <button type="button" class="btn-primary" onclick="location.reload()">{{ t.err_retry }}</button>
      <a href="{{ url_for('dashboard') if logged_in else url_for('login') }}" class="btn-primary error-secondary">{{ t.err_home }}</a>
    </div>
  </div>
  {% if logged_in %}{% include 'navbar.html' %}{% endif %}
</body>
</html>
