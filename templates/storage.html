<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ t.storage_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="glass-card">
    <div class="chat-header">
      <a href="{{ url_for('settings_page') }}" class="back-link">←</a>
      <h1 style="font-size:20px;">{{ t.storage_title }}</h1>
      <div style="width:36px;"></div>
    </div>

    <div style="text-align:center; padding:20px 0;">
      <div style="font-size:36px; font-weight:700;">{{ total_size }}</div>
      <div style="opacity:0.6; font-size:13px; margin-top:4px;">{{ file_count }} {{ t.files_used_label }}</div>
    </div>

    <p style="font-size:12px; color:rgba(var(--fg),0.6); text-align:center; padding:0 10px;">
      {{ t.storage_note }}
    </p>
  </div>

  {% include 'navbar.html' %}
</body>
</html>
