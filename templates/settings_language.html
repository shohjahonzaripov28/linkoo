<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ t.menu_language }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% from '_icons.html' import icon %}
  <div class="glass-card">
    <div class="chat-header">
      <a href="{{ url_for('settings_page') }}" class="back-link" style="transform:scaleX(-1); display:inline-flex;">{{ icon('chevron', 20) }}</a>
      <h1 style="font-size:20px;">{{ t.menu_language }}</h1>
      <div style="width:36px;"></div>
    </div>

    <div class="settings-list">
      {% for code, name in langs.items() %}
      <a href="{{ url_for('set_language', lang_code=code) }}" class="settings-row">
        <div class="settings-row-label">{{ name }}</div>
        {% if lang == code %}
          <span class="lang-check">✓</span>
        {% endif %}
      </a>
      {% endfor %}
    </div>
  </div>

  {% include 'navbar.html' %}
</body>
</html>
