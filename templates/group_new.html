<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ t.new_group }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% from '_icons.html' import icon %}
  <div class="glass-card feed-card">
    <div class="chat-header">
      <a href="{{ url_for('groups_list') }}" class="back-link">←</a>
      <h1 style="font-size:20px;">{{ t.new_group }}</h1>
      <div style="width:36px;"></div>
    </div>

    <form method="POST" class="new-post-form">
      <input type="text" name="name" class="shop-input" placeholder="{{ t.group_name_placeholder }}" required style="margin-bottom:14px;">

      <p style="font-size:13px; color:rgba(255,255,255,0.7); margin-bottom:8px;">{{ t.select_members }}</p>
      <div class="feed-list" style="max-height:220px; overflow-y:auto;">
        {% if users|length == 0 %}
          <p class="empty-feed">{{ t.no_other_users }}</p>
        {% endif %}
        {% for u in users %}
        <label class="person-row" style="cursor:pointer;">
          <input type="checkbox" name="members" value="{{ u.username }}" style="width:18px; height:18px;">
          <div class="avatar-circle small">{{ u.avatar_letter }}</div>
          <div class="person-name">{{ u.username }}</div>
        </label>
        {% endfor %}
      </div>

      <button type="submit" class="btn-primary" style="margin-top:16px;">{{ t.create_group_btn }}</button>
    </form>
  </div>

  {% include 'navbar.html' %}
</body>
</html>
