<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ other_username }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="glass-card chat-card">
    <div class="chat-header">
      <a href="{{ url_for('people') }}" class="back-link">←</a>
      <div class="dm-title">
        <div class="avatar-circle small">{{ other_avatar }}</div>
        <h1 style="font-size:18px;">{{ other_username }}</h1>
      </div>
      <div style="width:36px;"></div>
    </div>

    <div id="messages" class="messages-box"></div>

    <form id="send-form" class="send-form">
      <input type="text" id="message-input" placeholder="Xabar yozing..." autocomplete="off" maxlength="1000">
      <button type="submit" class="btn-primary send-btn">→</button>
    </form>
  </div>

  <script>
    const me = "{{ username }}";
    const otherUsername = "{{ other_username }}";
    const messagesBox = document.getElementById("messages");
    const form = document.getElementById("send-form");
    const input = document.getElementById("message-input");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMessages(messages) {
      messagesBox.innerHTML = "";
      messages.forEach((m) => {
        const isMe = m.sender === me;
        const bubble = document.createElement("div");
        bubble.className = "msg-row " + (isMe ? "msg-right" : "msg-left");
        bubble.innerHTML = `
          <div class="msg-bubble ${isMe ? "msg-mine" : "msg-other"}">
            <div class="msg-text">${escapeHtml(m.content)}</div>
            <div class="msg-time">${m.created_at}</div>
          </div>
        `;
        messagesBox.appendChild(bubble);
      });
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function loadMessages() {
      try {
        const res = await fetch(`/api/dm/${otherUsername}`);
        if (!res.ok) return;
        const data = await res.json();
        renderMessages(data.messages);
      } catch (e) {
        console.error("Xabarlarni yuklashda xato:", e);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = input.value.trim();
      if (!content) return;
      input.value = "";
      try {
        await fetch(`/api/dm/send/${otherUsername}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content }),
        });
        loadMessages();
      } catch (e) {
        console.error("Xabar yuborishda xato:", e);
      }
    });

    loadMessages();
    setInterval(loadMessages, 2000);
  </script>
  {% include 'navbar.html' %}
</body>
</html>
