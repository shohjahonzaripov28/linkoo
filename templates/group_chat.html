<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ group.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="in-chat">
  {% from '_icons.html' import icon %}
  <div class="glass-card chat-card" data-kind="group" data-target="{{ group.id }}" data-me="{{ username }}">
    <div class="chat-header">
      <a href="{{ url_for('groups_list') }}" class="back-link">←</a>
      <div class="dm-title">
        <div class="avatar-circle small">{{ group.avatar_letter }}</div>
        <h1 style="font-size:18px;">{{ group.name }}</h1>
      </div>
      <div style="width:36px;"></div>
    </div>

    {% include '_chat_composer.html' %}
  </div>

  {% include 'navbar.html' %}
</body>
</html>
