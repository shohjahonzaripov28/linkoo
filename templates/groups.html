<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - Guruhlar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="glass-card feed-card">
    <div class="chat-header">
      <a href="{{ url_for('dashboard') }}" class="back-link">←</a>
      <h1 style="font-size:20px;">Guruhlar</h1>
      <a href="{{ url_for('group_new') }}" class="back-link" title="Yangi guruh">＋</a>
    </div>

    <div class="feed-list">
      {% if my_groups|length == 0 %}
        <p class="empty-feed">Hali guruhingiz yo'q. <a href="{{ url_for('group_new') }}" style="color:#c4b5fd;">Yangi guruh</a> yarating.</p>
      {% endif %}

      {% for g in my_groups %}
      <a href="{{ url_for('group_chat', group_id=g.id) }}" class="person-row">
        <div class="avatar-circle small">{{ g.avatar_letter }}</div>
        <div class="person-name">{{ g.name }}</div>
        <div class="person-arrow">→</div>
      </a>
      {% endfor %}
    </div>
  </div>

  {% include 'navbar.html' %}
</body>
</html>
