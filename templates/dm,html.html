<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ other_display }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="in-chat">
  {% from '_icons.html' import icon %}
  <div class="glass-card chat-card" data-kind="dm" data-target="{{ other_username }}" data-me="{{ username }}">
    <div class="chat-header">
      <a href="{{ url_for('shaxsiy') }}" class="back-link">←</a>
      <a href="{{ url_for('user_profile', target_username=other_username) }}" class="dm-title dm-title-link" title="{{ t.profile_open }}">
        {% if other_avatar_file %}
          <img class="avatar-circle small" src="{{ url_for('media', filename=other_avatar_file) }}" alt="">
        {% else %}
          <div class="avatar-circle small">{{ other_avatar }}</div>
        {% endif %}
        <h1 style="font-size:18px;">{{ other_display }}</h1>
      </a>
      <div class="chat-head-actions">
        <button type="button" class="head-btn" id="call-audio" aria-label="{{ t.call_audio }}">{{ icon('phone', 21) }}</button>
        <button type="button" class="head-btn" id="call-video" aria-label="{{ t.call_video }}">{{ icon('video', 21) }}</button>
        <div class="post-menu-wrap">
          <button type="button" class="head-btn" id="chat-menu-btn" aria-label="{{ t.chat_menu }}">{{ icon('more', 21) }}</button>
          <div class="post-menu" id="chat-menu" hidden>
            <a class="menu-item" href="{{ url_for('user_profile', target_username=other_username) }}">{{ t.profile_open }}</a>
            <button type="button" class="menu-item danger" id="block-toggle" data-blocked="{{ 1 if i_blocked else 0 }}">{{ t.unblock_user if i_blocked else t.block_user }}</button>
          </div>
        </div>
      </div>
    </div>

    {% include '_chat_composer.html' %}
  </div>

  <script>
    (function () {
      var other = "{{ other_username }}";
      document.getElementById("call-audio").addEventListener("click", function () { window.LinkoStartCall && window.LinkoStartCall("audio"); });
      document.getElementById("call-video").addEventListener("click", function () { window.LinkoStartCall && window.LinkoStartCall("video"); });
      var menu = document.getElementById("chat-menu");
      document.getElementById("chat-menu-btn").addEventListener("click", function (e) { e.stopPropagation(); menu.hidden = !menu.hidden; });
      document.addEventListener("click", function () { menu.hidden = true; });
      var tg = document.getElementById("block-toggle");
      tg.addEventListener("click", function () {
        var blocked = tg.dataset.blocked === "1";
        if (!blocked && !confirm("{{ t.confirm_block_user }}")) return;
        fetch("/api/blocks/" + encodeURIComponent(other) + (blocked ? "/remove" : ""), { method: "POST" })
          .then(function (r) { if (!r.ok) throw 0; location.reload(); })
          .catch(function () { alert("{{ t.err_network }}"); });
      });
    })();
  </script>

  {% include 'navbar.html' %}
</body>
</html>
