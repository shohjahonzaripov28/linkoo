<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - Sozlama</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="glass-card feed-card">
    <div class="chat-header">
      <a href="{{ url_for('dashboard') }}" class="back-link">←</a>
      <h1 style="font-size:20px;">Sozlama</h1>
      <div style="width:36px;"></div>
    </div>

    <div class="feed-list">
      <div class="person-row" style="cursor:default;">
        <div class="avatar-circle small">{{ avatar_letter }}</div>
        <div class="person-name">{{ username }}</div>
      </div>
      <p class="empty-feed">Boshqa sozlamalar (til, bildirishnoma, parolni o'zgartirish) tez orada qo'shiladi.</p>
      <a href="{{ url_for('logout') }}" class="logout-link" style="margin-top:10px;">Chiqish</a>
    </div>
  </div>

  {% include 'navbar.html' %}
</body>
</html>
