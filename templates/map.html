<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko Map</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <style>
    /* ================================================================
       Linko Map sahifasi (faqat shu sahifa uchun)
       ================================================================ */
    body.map-page {
      margin: 0;
      padding: 0 !important;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #01030a !important;
      color: #e6f2ff;
    }
    #stars, #map { position: fixed; top: 0; bottom: 0; left: 0; right: 0; }
    #stars { z-index: 0; width: 100%; height: 100%; }
    #map { z-index: 1; background: transparent; }
    .maplibregl-canvas { outline: none; }
    .maplibregl-ctrl-attrib { background: rgba(0, 0, 0, .45) !important; color: #9fb4d6; font-size: 10px; }
    .maplibregl-ctrl-attrib a { color: #bcd2f5; }
    .maplibregl-popup-content { background: rgba(6, 14, 32, .94); color: #e6f2ff; border: 1px solid rgba(120, 200, 255, .3); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
    .maplibregl-popup-tip { display: none; }
    .maplibregl-popup-close-button { color: #9fdcff; font-size: 18px; }

    /* --- Yuqori panel --- */
    .mp-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 8;
      display: flex; align-items: center; gap: 10px;
      padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
      background: linear-gradient(180deg, rgba(1, 3, 10, .75), rgba(1, 3, 10, 0));
      pointer-events: none;
    }
    .mp-top > * { pointer-events: auto; }
    .mp-back { color: #9fdcff; text-decoration: none; font-size: 22px; padding: 6px 8px; }
    .mp-title { flex: 1; min-width: 0; }
    .mp-title h1 {
      margin: 0; font-size: 18px; font-weight: 800;
      background: linear-gradient(90deg, #7dd3fc, #a78bfa 60%, #f0abfc);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .mp-hud { font-family: Consolas, "Courier New", monospace; font-size: 11px; letter-spacing: 2px; color: #78dcff; text-shadow: 0 0 8px rgba(80, 200, 255, .8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-tools { display: flex; gap: 6px; align-items: center; }
    .mp-btn {
      height: 36px; min-width: 36px; padding: 0 10px; border-radius: 12px;
      border: 1px solid rgba(120, 200, 255, .25); background: rgba(6, 12, 30, .6);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: #d6eeff; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
      transition: background .2s, border-color .2s, box-shadow .2s;
    }
    .mp-btn svg { width: 18px; height: 18px; flex: none; }
    .mp-btn:hover { border-color: rgba(120, 200, 255, .55); }
    .mp-btn.on { background: rgba(40, 150, 255, .3); border-color: rgba(120, 210, 255, .85); box-shadow: 0 0 14px rgba(70, 180, 255, .45); }
    .mp-btn.primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); border: none; color: #fff; }

    /* --- Sayohat (scroll) --- */
    #tour {
      position: fixed; inset: 0; z-index: 5;
      overflow-y: auto; overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #tour::-webkit-scrollbar { display: none; }
    .mp-step {
      height: 100vh; height: 100dvh;
      scroll-snap-align: start;
      display: flex; align-items: center;
      padding: 90px 28px 40px;
      box-sizing: border-box;
      pointer-events: none;
    }
    .mp-card {
      pointer-events: auto;
      width: min(420px, 100%);
      background: rgba(4, 10, 26, .72);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(120, 200, 255, .2);
      border-radius: 22px;
      padding: 20px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
      opacity: .35; transform: translateY(18px);
      transition: opacity .6s, transform .6s;
    }
    .mp-step.active .mp-card { opacity: 1; transform: none; }
    .mp-num { font-family: Consolas, monospace; font-size: 11px; letter-spacing: 2px; color: #78dcff; }
    .mp-card h2 { margin: 6px 0 4px; font-size: 24px; line-height: 1.2; }
    .mp-stat {
      font-family: Consolas, monospace; font-size: 30px; font-weight: 700; margin: 6px 0 8px;
      background: linear-gradient(90deg, #7dd3fc, #c4b5fd);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .mp-card p { margin: 0 0 14px; font-size: 15px; line-height: 1.55; color: #cfe3ff; }
    .mp-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .mp-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #86efac; margin-bottom: 10px; }
    .mp-live i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: mpPulse 1.4s infinite; }
    @keyframes mpPulse { 50% { opacity: .3; } }

    .mp-intro { justify-content: center; text-align: center; }
    .mp-intro .mp-card { width: min(560px, 100%); text-align: center; opacity: 1; transform: none; }
    .mp-intro h2 { font-size: clamp(28px, 5vw, 44px); }
    .mp-intro .mp-actions { justify-content: center; }
    .mp-scrollhint { margin-top: 14px; font-size: 12px; color: #8ea3c7; animation: mpBob 1.6s infinite; }
    @keyframes mpBob { 50% { transform: translateY(5px); } }

    /* Progress */
    #mp-progress { position: fixed; z-index: 9; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899); transition: width .4s; }
    #mp-dots { position: fixed; z-index: 7; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
    #mp-dots button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: none; background: rgba(160, 200, 255, .3); cursor: pointer; }
    #mp-dots button.on { background: #7dd3fc; box-shadow: 0 0 8px #7dd3fc; transform: scale(1.4); }

    /* --- Erkin xarita paneli --- */
    #explore-bar {
      position: fixed; z-index: 8; left: 14px; right: 14px;
      top: calc(64px + env(safe-area-inset-top));
      display: none; flex-wrap: wrap; gap: 8px; align-items: flex-start;
    }
    body.explore #explore-bar { display: flex; }
    body.explore #tour, body.explore #mp-dots { display: none; }
    .mp-search { position: relative; z-index: 3; flex: 1 1 260px; max-width: 460px; }
    .mp-search input {
      width: 100%; box-sizing: border-box; height: 40px; border-radius: 14px;
      border: 1px solid rgba(120, 200, 255, .3); background: rgba(6, 12, 30, .8);
      backdrop-filter: blur(10px); color: #fff; padding: 0 14px; font-size: 16px; outline: none;
    }
    .mp-results { position: absolute; top: 44px; left: 0; right: 0; background: rgba(6, 12, 30, .96); border: 1px solid rgba(120, 200, 255, .25); border-radius: 14px; overflow: hidden; display: none; }
    .mp-results button { display: block; width: 100%; text-align: left; background: none; border: none; color: #e6f2ff; padding: 10px 14px; font: inherit; font-size: 14px; cursor: pointer; border-bottom: 1px solid rgba(120, 200, 255, .08); }
    .mp-results button:hover { background: rgba(60, 130, 246, .2); }
    .mp-results small { display: block; color: #8ea3c7; font-size: 12px; }
    .mp-btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
    .mp-btn.tall { height: 40px; }

    #mp-toast {
      position: fixed; z-index: 20; left: 50%; bottom: 110px; transform: translateX(-50%);
      max-width: min(92vw, 420px); padding: 10px 16px; border-radius: 14px;
      background: rgba(10, 20, 44, .94); border: 1px solid rgba(120, 200, 255, .35);
      color: #dff4ff; font-size: 13.5px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #mp-toast.show { opacity: 1; }

    /* Joylashuvim nuqtasi va kosmik stansiya belgisi */
    .me-dot { width: 16px; height: 16px; border-radius: 50%; background: #3b82f6; border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(59, 130, 246, .6); animation: meRing 1.8s infinite; }
    @keyframes meRing { to { box-shadow: 0 0 0 22px rgba(59, 130, 246, 0); } }
    .sat-label { font-family: Consolas, monospace; font-size: 11px; color: #ffe08a; text-shadow: 0 0 6px #000, 0 0 10px rgba(255, 200, 80, .8); white-space: nowrap; pointer-events: none; transform: translate(14px, -14px); }
    .sat-label b { font-size: 14px; }

    /* Telefon: kartochka pastda, pastki menyu yashiriladi */
    @media (max-width: 899px) {
      body.map-page .bottom-nav { display: none; }
      .mp-step { align-items: flex-end; padding: 80px 12px calc(18px + env(safe-area-inset-bottom)); }
      .mp-intro { align-items: center; }
      .mp-card { padding: 16px 18px; border-radius: 20px; }
      .mp-card h2 { font-size: 20px; }
      .mp-stat { font-size: 24px; margin: 2px 0 6px; }
      .mp-card p { font-size: 14px; }
      #mp-dots { display: none; }
      .mp-tools .mp-btn .lbl, .mp-btnrow .mp-btn .lbl { display: none; }
      #mp-toast { bottom: 30px; }
    }
    /* Kompyuter: chapda Linko menyusi */
    @media (min-width: 900px) {
      #map, #stars, #tour, .mp-top, #mp-progress { left: 236px; }
      #explore-bar { left: 250px; }
      .mp-step { padding-left: 48px; }
      #mp-toast { left: calc(50% + 118px); }
    }
  </style>
</head>
<body class="map-page">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="map"></div>
  <div id="mp-progress"></div>

  <header class="mp-top">
    <a href="{{ url_for('dashboard') }}" class="mp-back" aria-label="Back">←</a>
    <div class="mp-title">
      <h1>Linko Map</h1>
      <div class="mp-hud" id="mp-hud">GLOBAL VIEW</div>
    </div>
    <div class="mp-tools">
      <button type="button" class="mp-btn" id="voice-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
      <button type="button" class="mp-btn" id="mode-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16M16 6v16"/></svg>
        <span class="lbl" id="mode-lbl"></span>
      </button>
    </div>
  </header>

  <div id="explore-bar">
    <div class="mp-search">
      <input type="search" id="search-input" autocomplete="off" enterkeyhint="search">
      <div class="mp-results" id="search-results"></div>
    </div>
    <div class="mp-btnrow">
      <button type="button" class="mp-btn tall" id="locate-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lbl" data-t="locate"></span>
      </button>
      <button type="button" class="mp-btn tall" id="planes-btn">✈️ <span class="lbl" data-t="planes"></span></button>
      <button type="button" class="mp-btn tall" id="sats-btn">🛰️ <span class="lbl" data-t="sats"></span></button>
      <button type="button" class="mp-btn tall" id="style-btn">🗺️ <span class="lbl" id="style-lbl"></span></button>
      <button type="button" class="mp-btn tall" id="tilt-btn">3D</button>
    </div>
  </div>

  <div id="tour"></div>
  <nav id="mp-dots" aria-hidden="true"></nav>
  <div id="mp-toast" role="status"></div>

  {% include 'navbar.html' %}

  <script>
    window.LINKO_MAP = {
      lang: {{ lang|tojson }},
      maptilerKey: {{ maptiler_key|tojson }},
      startMode: {{ start_mode|tojson }}
    };
  </script>
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="{{ url_for('static', filename='map_tour.js') }}"></script>
  <script src="{{ url_for('static', filename='map.js') }}"></script>
</body>
</html>
