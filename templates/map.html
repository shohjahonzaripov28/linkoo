<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko Map</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script type="importmap">{"imports": {"three": "{{ url_for('static', filename='space/three.module.min.js') }}"}}</script>
  <style>
    /* ================================================================
       Linko Map: tumanli kinematik sayohat (canvas) + erkin xarita
       ================================================================ */
    body.map-page {
      --mist: #0b1120; --ink: #f1f4f9; --ink2: rgba(241,244,249,.66); --line: rgba(241,244,249,.22); --glass: rgba(11,17,32,.42);
      margin: 0; padding: 0 !important; display: block !important;
      height: 100vh; height: 100dvh; overflow: hidden;
      background: var(--mist) !important; animation: none !important; color: var(--ink);
      font-family: "Helvetica Neue", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    }
    html[data-theme="light"] body.map-page {
      --mist: #eceef0; --ink: #171b22; --ink2: rgba(23,27,34,.62); --line: rgba(23,27,34,.2); --glass: rgba(255,255,255,.5);
    }
    body.map-page::before, body.map-page::after { display: none !important; }
    .lm-fixed { position: fixed; top: 0; bottom: 0; left: 0; right: 0; }

    #cv { z-index: 1; width: 100%; height: 100%; display: block; }
    #story { z-index: 3; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior: none; }
    #story::-webkit-scrollbar { display: none; }
    #track { width: 1px; }

    /* --- Katta yozuv (ekran bo'ylab) --- */
    #big {
      position: fixed; z-index: 4; left: 0; right: 0; top: 50%; margin-top: -0.6em;
      text-align: center; white-space: nowrap; pointer-events: none;
      font-weight: 200; font-size: clamp(46px, 11.5vw, 190px); line-height: 1.2;
      letter-spacing: .32em; text-indent: .32em; color: var(--ink); opacity: 0;
      will-change: opacity, transform;
    }

    /* --- Pastki matn --- */
    #cap { position: fixed; z-index: 4; left: 0; bottom: 0; pointer-events: none; opacity: 0;
      padding: 0 28px calc(34px + env(safe-area-inset-bottom)); max-width: 520px; will-change: opacity, transform; }
    .cap-idx { font-size: 11px; letter-spacing: .32em; color: var(--ink2); }
    .cap-idx b { font-weight: 600; color: var(--ink); }
    .cap-name { margin: 10px 0 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 300; letter-spacing: .02em; }
    .cap-stat { margin: 4px 0 0; font-size: clamp(14px, 1.3vw, 16px); font-weight: 600; letter-spacing: .18em; color: var(--ink2); }
    .cap-text { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.6; font-weight: 400; color: var(--ink2); }
    .cap-go { pointer-events: auto; margin-top: 18px; height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--ink);
      background: var(--ink); color: var(--mist); font: inherit; font-size: 13px; letter-spacing: .2em; font-weight: 600; cursor: pointer; display: none; }
    .cap-go.show { display: inline-block; }

    /* --- Boshlash ishorasi --- */
    #hint { position: fixed; z-index: 4; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
      font-size: 10px; letter-spacing: .4em; text-indent: .4em; color: var(--ink2); transition: opacity .4s; }
    #hint i { width: 1px; height: 46px; background: var(--line); position: relative; overflow: hidden; }
    #hint i::after { content: ""; position: absolute; left: 0; top: -40%; width: 1px; height: 40%; background: var(--ink); animation: lmDrop 1.8s ease-in-out infinite; }
    @keyframes lmDrop { to { top: 100%; } }

    /* --- O'ng pastdagi doira (umumiy progress) --- */
    #ring { position: fixed; z-index: 4; right: 26px; bottom: calc(30px + env(safe-area-inset-bottom)); width: 46px; height: 46px; pointer-events: none; }
    #ring circle { fill: none; stroke-width: 1; }
    #ring .bg { stroke: var(--line); }
    #ring .fg { stroke: var(--ink); stroke-dasharray: 138.2; stroke-dashoffset: 138.2; transform: rotate(-90deg); transform-origin: 50% 50%; }
    #ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; letter-spacing: .1em; color: var(--ink2); }

    /* --- Yuqori panel --- */
    .lm-top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
      padding: calc(14px + env(safe-area-inset-top)) 18px 10px; pointer-events: none; }
    .lm-top > * { pointer-events: auto; }
    .lm-back { color: var(--ink); text-decoration: none; display: inline-flex; padding: 6px; }
    .lm-back svg { width: 22px; height: 22px; }
    .lm-brand { flex: 1; min-width: 0; font-size: 11px; font-weight: 500; letter-spacing: .42em; color: var(--ink); white-space: nowrap; overflow: hidden; }
    .lm-btn { height: 36px; min-width: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink);
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .16em; cursor: pointer; white-space: nowrap; }
    .lm-btn svg { width: 16px; height: 16px; flex: none; }
    .lm-btn.on { background: var(--ink); color: var(--mist); border-color: var(--ink); }
    .lm-btn.icon { padding: 0; width: 36px; }
    .lm-btn .ti-sun { display: none; }
    html[data-theme="light"] .lm-btn .ti-sun { display: inline-flex; }
    html[data-theme="light"] .lm-btn .ti-moon { display: none; }
    #progress { position: fixed; z-index: 11; top: 0; left: 0; height: 1px; width: 0; background: var(--ink); opacity: .7; }

    /* --- Erkin xarita --- */
    #mapwrap { z-index: 8; display: none; background: var(--mist); }
    body.explore #mapwrap { display: block; }
    body.explore #story, body.explore #big, body.explore #cap, body.explore #hint, body.explore #ring { display: none; }
    #map { position: absolute; inset: 0; }
    #mapbar { position: absolute; z-index: 3; left: 14px; right: 14px; top: calc(62px + env(safe-area-inset-top)); display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    .lm-search { position: relative; z-index: 4; flex: 1 1 240px; max-width: 460px; }
    .lm-search input { width: 100%; box-sizing: border-box; height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--ink); padding: 0 18px; font: inherit; font-size: 16px; outline: none; }
    .lm-search input::placeholder { color: var(--ink2); }
    .lm-results { position: absolute; top: 48px; left: 0; right: 0; background: var(--mist); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: none; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
    .lm-results button { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); padding: 11px 16px; font: inherit; font-size: 14px; color: inherit; cursor: pointer; }
    .lm-results button:last-child { border-bottom: none; }
    .lm-results button:hover { background: var(--glass); }
    .lm-results small { display: block; color: var(--ink2); font-size: 12px; }
    .lm-mapbtns { display: flex; gap: 6px; flex-wrap: wrap; }
    .lm-mapbtns .lm-btn { height: 42px; }
    .me-dot { width: 16px; height: 16px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; animation: meRing 1.8s infinite; }
    @keyframes meRing { 0% { box-shadow: 0 0 0 0 rgba(37,99,235,.5); } 100% { box-shadow: 0 0 0 22px rgba(37,99,235,0); } }

    #toast { position: fixed; z-index: 20; left: 50%; bottom: 34px; transform: translateX(-50%); max-width: min(92vw, 420px); padding: 10px 18px; border-radius: 999px;
      background: var(--ink); color: var(--mist); font-size: 13px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
    #toast.show { opacity: 1; }
    #fade { z-index: 9; background: var(--mist); opacity: 0; pointer-events: none; transition: opacity .7s ease; }
    #fade.on { opacity: 1; }

    @media (max-width: 899px) {
      body.map-page .bottom-nav { display: none; }
      #cap { padding: 0 22px calc(30px + env(safe-area-inset-bottom)); max-width: none; right: 70px; }
      .cap-text { font-size: 13.5px; }
      #hint { bottom: auto; top: 64%; }
      #ring { right: 18px; bottom: calc(30px + env(safe-area-inset-bottom)); width: 40px; height: 40px; }
      .lm-top .lm-btn .lbl, .lm-mapbtns .lbl { display: none; }
      .lm-top .lm-btn { padding: 0; width: 36px; }
    }
    @media (min-width: 900px) {
      .lm-fixed, .lm-top, #cap, #big, #progress { left: 236px; }
      #cap { padding-left: 48px; }
      .lm-top { padding-left: 30px; padding-right: 30px; }
      #ring { right: 40px; }
    }
    html.reduce-motion #hint i::after { animation: none; }
    /* --- Koinot (Quyosh tizimi) --- */
    #space { z-index: 8; display: none; background: #02040a; color: #eef2fb; overflow: hidden; }
    body.space #space { display: block; }
    body.space .lm-top .lm-brand, body.space .lm-top .lm-back { color: #eef2fb; }
    body.space .lm-top [data-theme-toggle] { display: none; }
    .sp-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    .sp-cv:active { cursor: grabbing; }
    .sp-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .sp-label { position: absolute; left: 0; top: 0; pointer-events: auto; background: none; border: none; cursor: pointer; white-space: nowrap;
      color: #dfe7f7; font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; padding: 4px 6px;
      text-shadow: 0 1px 8px #000, 0 0 2px #000; opacity: .82; transition: opacity .3s, color .3s; }
    .sp-label:hover, .sp-label.on { color: #7dd3fc; opacity: 1; }
    .sp-labels.focused .sp-label:not(.on) { opacity: .32; }
    .sp-bar { position: absolute; z-index: 3; right: 14px; top: calc(62px + env(safe-area-inset-top)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .sp-btn { height: 38px; min-width: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(8,12,24,.55);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #eef2fb; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .06em; cursor: pointer; }
    .sp-btn:hover { background: rgba(255,255,255,.12); }
    .sp-icon { padding: 0; width: 38px; font-size: 11px; }
    .sp-card { position: absolute; z-index: 3; left: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); width: min(360px, calc(100% - 28px));
      max-height: 56vh; overflow-y: auto; box-sizing: border-box; padding: 16px 16px 14px; border-radius: 20px;
      background: rgba(6,10,22,.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.12);
      animation: spIn .35s ease-out; }
    @keyframes spIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .sp-kind { font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase; color: #7dd3fc; }
    .sp-name { margin: 4px 0 6px; font-size: 26px; font-weight: 300; letter-spacing: .02em; color: #fff; }
    .sp-desc { margin: 0 0 12px; font-size: 13.5px; line-height: 1.55; color: rgba(238,242,251,.78); }
    .sp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sp-cell { background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 10px; min-width: 0; }
    .sp-cell small { display: block; font-size: 10.5px; color: rgba(238,242,251,.55); margin-bottom: 2px; }
    .sp-cell b { display: block; font-size: 13.5px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
    .sp-acts { display: flex; gap: 8px; margin-top: 12px; }
    .sp-go { flex: 1; height: 42px; border: none; border-radius: 12px; background: #3b82f6; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .sp-go:hover { background: #2563eb; }
    .sp-tip { position: absolute; z-index: 2; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); pointer-events: none;
      font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase; color: rgba(238,242,251,.6); white-space: nowrap; }
    .sp-tip[hidden], .sp-card[hidden], .sp-btn[hidden], .sp-loading[hidden] { display: none; }
    .sp-credit { position: absolute; z-index: 2; right: 10px; bottom: calc(6px + env(safe-area-inset-bottom)); font-size: 9.5px; color: rgba(238,242,251,.35); pointer-events: none; }
    .sp-loading { position: absolute; z-index: 4; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: .3em;
      text-transform: uppercase; color: rgba(238,242,251,.7); background: #02040a; pointer-events: none; }
    #space-hint { position: absolute; z-index: 3; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); opacity: 0;
      pointer-events: none; transition: opacity .4s, transform .4s; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); font-size: 11px; letter-spacing: .14em; white-space: nowrap; }
    #space-hint.show { opacity: 1; transform: translate(-50%, 0); }
    #surface-bar { position: absolute; z-index: 3; left: 14px; right: 14px; top: calc(62px + env(safe-area-inset-top)); display: none; gap: 8px; align-items: center; }
    body.surface #surface-bar { display: flex; }
    body.surface #mapbar { display: none; }
    #surface-name { font-size: 12px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--ink); padding: 0 6px; }
    @media (max-width: 699px) {
      .sp-card { left: 10px; right: 10px; width: auto; max-height: 46vh; bottom: calc(10px + env(safe-area-inset-bottom)); }
      .sp-name { font-size: 22px; }
      .sp-bar { right: 10px; }
      .sp-credit { display: none; }
    }
  </style>
</head>
<body class="map-page">
  <canvas id="cv" class="lm-fixed" aria-hidden="true"></canvas>
  <div id="progress"></div>

  <div id="story" class="lm-fixed"><div id="track"></div></div>

  <div id="big" aria-hidden="true"></div>
  <div id="cap">
    <div class="cap-idx"><b id="cap-n">01</b> — 12 &nbsp;·&nbsp; <span id="cap-tag"></span></div>
    <div class="cap-name" id="cap-name"></div>
    <div class="cap-stat" id="cap-stat"></div>
    <p class="cap-text" id="cap-text"></p>
    <button type="button" class="cap-go" id="cap-go"></button>
  </div>
  <div id="hint"><span id="hint-t">SCROLL</span><i></i></div>
  <svg id="ring" viewBox="0 0 46 46" aria-hidden="true"><circle class="bg" cx="23" cy="23" r="22"/><circle class="fg" id="ring-fg" cx="23" cy="23" r="22"/></svg>

  <div id="mapwrap" class="lm-fixed">
    <div id="map"></div>
    <div id="mapbar">
      <div class="lm-search">
        <input type="search" id="search-input" autocomplete="off" enterkeyhint="search">
        <div class="lm-results" id="search-results"></div>
      </div>
      <div class="lm-mapbtns">
        <button type="button" class="lm-btn" id="locate-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lbl" data-t="locate"></span></button>
        <button type="button" class="lm-btn" id="style-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><span class="lbl" id="style-lbl"></span></button>
        <button type="button" class="lm-btn" id="tilt-btn">3D</button>
      </div>
    </div>
    <div id="surface-bar">
      <button type="button" class="lm-btn" id="surface-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="4"/></svg><span class="lbl" id="surface-back-lbl"></span></button>
      <span id="surface-name"></span>
    </div>
    <div id="space-hint"></div>
  </div>
  <div id="space" class="lm-fixed" aria-label="Solar System"></div>
  <div id="fade" class="lm-fixed"></div>

  <header class="lm-top">
    <a href="{{ url_for('dashboard') }}" class="lm-back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="lm-brand">LINKO&nbsp;&nbsp;MAP</div>
    <button type="button" class="lm-btn icon" data-theme-toggle aria-label="Theme"><span class="ti-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span><span class="ti-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button>
    <button type="button" class="lm-btn" id="mode-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16M16 6v16"/></svg><span class="lbl" id="mode-lbl"></span></button>
  </header>

  <div id="toast" role="status"></div>

  {% include 'navbar.html' %}

  <script>
    window.LINKO_MAP = {
      lang: {{ lang|tojson }},
      maptilerKey: {{ maptiler_key|tojson }},
      frameBase: "/static/map/p",
      startMode: {{ start_mode|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='map_tour.js') }}"></script>
  <script src="{{ url_for('static', filename='map.js') }}"></script>
</body>
</html>
