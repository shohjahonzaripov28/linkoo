<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ t.qr_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="glass-card">
    <div class="chat-header">
      <a href="{{ url_for('people') }}" class="back-link">←</a>
      <h1 style="font-size:20px;">{{ t.qr_title }}</h1>
      <div style="width:36px;"></div>
    </div>

    <div class="avatar-circle" style="margin: 10px auto 16px auto;">{{ avatar_letter }}</div>
    <p style="text-align:center; margin-bottom:16px;">@{{ nickname if nickname else username }}</p>

    {% if qr_b64 %}
    <div style="background:#fff; border-radius:16px; padding:16px; width:fit-content; margin:0 auto 16px auto;">
      <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR kod" style="width:220px; height:220px; display:block;">
    </div>
    <p style="font-size:12px; text-align:center; color:rgba(255,255,255,0.65); padding:0 10px;">
      {{ t.qr_note }}
    </p>
    {% else %}
    <p class="empty-feed">{{ t.qr_failed_note }}</p>
    {% endif %}
  </div>

  {% include 'navbar.html' %}
</body>
</html>
