<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ t.scan_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="glass-card">
    <div class="chat-header">
      <a href="{{ url_for('dashboard') }}" class="back-link">←</a>
      <h1 style="font-size:20px;">{{ t.scan_title }}</h1>
      <a href="{{ url_for('qr_page') }}" class="back-link" title="{{ t.qr_title }}">▦</a>
    </div>

    <div class="scan-frame">
      <video id="scan-video" playsinline autoplay muted></video>
      <div class="scan-box"></div>
    </div>
    <canvas id="scan-canvas" style="display:none;"></canvas>

    <p id="scan-status" style="text-align:center; font-size:13px; opacity:0.8; margin-top:14px;">
      {{ t.scan_opening_camera }}
    </p>

    <div class="scan-tools">
      <label class="scan-upload-btn">
        {{ t.scan_upload_photo }}
        <input type="file" id="scan-file" accept="image/*" style="display:none;">
      </label>
      <form class="scan-manual" id="manual-form">
        <input type="text" id="manual-input" placeholder="{{ t.scan_manual_placeholder }}" autocapitalize="none" autocomplete="off">
        <button type="submit" class="btn-primary">{{ t.scan_open_btn }}</button>
      </form>
    </div>
  </div>

  {% include 'navbar.html' %}

  <script>
    const T = {
      instruction: "{{ t.scan_camera_ready }}",
      noCamera: "{{ t.scan_no_camera }}",
      httpsNeeded: "{{ t.scan_https_needed }}",
      found: "{{ t.scan_found }}",
      foundText: "{{ t.scan_found_text }}",
      notRecognized: "{{ t.scan_not_recognized }}",
    };

    const video = document.getElementById("scan-video");
    const canvas = document.getElementById("scan-canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const statusEl = document.getElementById("scan-status");
    let scanning = true;

    // 1) Brauzerning o'z QR o'qigichi (Android Chrome va boshqalar) - eng tez va ishonchli
    let detector = null;
    if ("BarcodeDetector" in window) {
      try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { detector = null; }
    }

    // 2) Zaxira: jsQR kutubxonasi (bir nechta manzildan yuklanadi)
    const JSQR_URLS = [
      "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js",
      "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
      "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js",
    ];
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    let jsqrPromise = null;
    function ensureJsQR() {
      if (window.jsQR) return Promise.resolve(true);
      if (!jsqrPromise) {
        jsqrPromise = (async () => {
          for (const url of JSQR_URLS) {
            try { await loadScript(url); if (window.jsQR) return true; } catch (e) { /* keyingisi */ }
          }
          return false;
        })();
      }
      return jsqrPromise;
    }
    if (!detector) ensureJsQR();

    function handleResult(text) {
      scanning = false;
      text = (text || "").trim();
      try {
        const url = new URL(text);
        if (url.pathname.startsWith("/u/") || url.pathname.startsWith("/add/")) {
          statusEl.textContent = T.found;
          window.location.href = url.pathname;
          return true;
        }
      } catch (e) { /* URL emas */ }
      if (/^@?[A-Za-z0-9_.]{3,24}$/.test(text)) {
        statusEl.textContent = T.found;
        window.location.href = "/people?q=" + encodeURIComponent(text.replace(/^@/, ""));
        return true;
      }
      statusEl.innerHTML = T.foundText + " <b>" + text.replace(/</g, "&lt;") + "</b>";
      return false;
    }

    async function decodeSource(source, width, height, extraAttempts) {
      if (detector) {
        try {
          const codes = await detector.detect(source);
          if (codes && codes.length) return codes[0].rawValue;
        } catch (e) { /* jsQR ga o'tamiz */ }
      }
      if (await ensureJsQR()) {
        const scale = Math.min(1, 800 / Math.max(width, height));
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));
        ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(img.data, img.width, img.height, {
          inversionAttempts: extraAttempts ? "attemptBoth" : "dontInvert",
        });
        if (code && code.data) return code.data;
      }
      return null;
    }

    async function tick() {
      if (!scanning) return;
      if (video.readyState >= 2 && video.videoWidth > 0) {
        try {
          const value = await decodeSource(video, video.videoWidth, video.videoHeight, false);
          if (value) { handleResult(value); return; }
        } catch (e) { /* keyingi kadr */ }
      }
      setTimeout(tick, 150);
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = window.isSecureContext ? T.noCamera : T.httpsNeeded;
        return;
      }
      let stream = null;
      const attempts = [
        { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: true, audio: false },
      ];
      for (const constraints of attempts) {
        try { stream = await navigator.mediaDevices.getUserMedia(constraints); break; } catch (e) { /* keyingisi */ }
      }
      if (!stream) { statusEl.textContent = T.noCamera; return; }
      video.srcObject = stream;
      try { await video.play(); } catch (e) { /* autoplay ishlaydi */ }
      statusEl.textContent = T.instruction;
      tick();
    }

    // Rasmdan o'qish (kamera ishlamasa ham ishlaydi)
    document.getElementById("scan-file").addEventListener("change", async (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = async () => {
        const value = await decodeSource(img, img.naturalWidth, img.naturalHeight, true);
        URL.revokeObjectURL(img.src);
        if (value) handleResult(value); else statusEl.textContent = T.notRecognized;
      };
      img.onerror = () => { statusEl.textContent = T.notRecognized; };
      img.src = URL.createObjectURL(file);
    });

    // Qo'lda @nik kiritish
    document.getElementById("manual-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const v = document.getElementById("manual-input").value.trim().replace(/^@/, "");
      if (v) window.location.href = "/people?q=" + encodeURIComponent(v);
    });

    startCamera();
  </script>
</body>
</html>
