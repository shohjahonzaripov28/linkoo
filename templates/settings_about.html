<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linko - {{ t.menu_about }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% from '_icons.html' import icon %}
  <div class="glass-card">
    <div class="chat-header">
      <a href="{{ url_for('settings_page') }}" class="back-link" style="transform:scaleX(-1); display:inline-flex;">{{ icon('chevron', 20) }}</a>
      <h1 style="font-size:20px;">{{ t.menu_about }}</h1>
      <div style="width:36px;"></div>
    </div>

    <div style="text-align:center; padding:20px 10px 30px 10px;">
      <div class="avatar-circle" style="margin:0 auto 14px auto; font-size:22px;">L</div>
      <div style="font-weight:700; font-size:18px;">Linko</div>
      <div style="opacity:0.5; font-size:12px; margin-top:2px;">Version 0.1 (beta)</div>
    </div>

    <div class="settings-list">
      <a href="{{ url_for('privacy_page') }}" class="settings-row">
        <div class="settings-icon-badge">{{ icon('lock', 18) }}</div>
        <div class="settings-row-label">Maxfiylik va shartlar</div>
        <span class="chevron">{{ icon('chevron', 16) }}</span>
      </a>
    </div>

    <p style="text-align:center; font-size:11px; opacity:0.4; margin-top:20px;">Claude bilan birga qurilgan</p>
  </div>

  {% include 'navbar.html' %}
</body>
</html>
