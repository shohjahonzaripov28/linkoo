<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2980b9">
<title>Linko</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --text: #1c2833; --muted: #7f8c8d;
    --primary: #2980b9; --mine: #2980b9; --mine-text: #ffffff;
    --other: #e8ecef; --error: #c0392b; --border: #dde2e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1216; --panel: #1b232b; --text: #e6ebef; --muted: #8a97a3;
      --primary: #3498db; --mine: #2471a3; --other: #26313b; --border: #2c3843;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .screen {
    display: none; flex-direction: column; height: 100dvh;
    max-width: 640px; margin: 0 auto; background: var(--panel);
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  .screen.active { display: flex; }

  /* ---- kirish ---- */
  #login { justify-content: center; padding: 32px; }
  #login h1 { font-size: 44px; margin: 0; text-align: center; color: var(--primary); }
  #login p { text-align: center; color: var(--muted); margin: 6px 0 32px; }
  input, button { font: inherit; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font-size: 16px; /* 16px: iPhone yaqinlashtirmasligi uchun */
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg); color: var(--text); outline: none;
  }
  input[type=text]:focus { border-color: var(--primary); }
  .primary {
    width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px;
    background: var(--primary); color: #fff; font-weight: 600; cursor: pointer;
  }
  .primary:disabled { opacity: .6; cursor: default; }
  #status { min-height: 22px; margin-top: 14px; text-align: center; color: var(--error); font-size: 14px; }

  /* ---- chat ---- */
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  header h2 { margin: 0; flex: 1; color: var(--primary); }
  header button {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    padding: 7px 12px; border-radius: 10px; cursor: pointer;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 16px; overflow-wrap: anywhere; }
  .msg.mine { align-self: flex-end; background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; background: var(--other); border-bottom-left-radius: 4px; }
  .msg .name { font-size: 12px; font-weight: 700; color: #27ae60; margin-bottom: 2px; }
  .msg .time { font-size: 11px; opacity: .65; text-align: right; margin-top: 2px; }
  .sys { align-self: center; font-size: 13px; color: var(--muted); font-style: italic; text-align: center; }
  .sys.err { color: var(--error); }
  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
  form input { flex: 1; }
  form button {
    border: 0; border-radius: 12px; padding: 0 18px; background: var(--primary);
    color: #fff; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<section id="login" class="screen active">
  <h1>Linko</h1>
  <p>Chatga kirish</p>
  <input id="nick" type="text" placeholder="Nikingiz" maxlength="20" autocomplete="off" autofocus>
  <button id="loginBtn" class="primary">Kirish</button>
  <div id="status"></div>
</section>

<section id="chat" class="screen">
  <header>
    <h2>Linko</h2>
    <button id="who" type="button">Onlayn</button>
    <button id="leave" type="button">Chiqish</button>
  </header>
  <div id="messages"></div>
  <form id="form">
    <input id="text" type="text" placeholder="Xabar yozing..." maxlength="1000" autocomplete="off">
    <button type="submit">Yuborish</button>
  </form>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const loginScreen = $("login"), chatScreen = $("chat");
  const nickInput = $("nick"), loginBtn = $("loginBtn"), statusEl = $("status");
  const messages = $("messages"), form = $("form"), textInput = $("text");

  let ws = null;        // hozirgi ulanish
  let myNick = "";
  let inChat = false;

  try { nickInput.value = localStorage.getItem("linko_nick") || ""; } catch (e) {}

  function setStatus(text) { statusEl.textContent = text; }

  function showScreen(name) {
    loginScreen.classList.toggle("active", name === "login");
    chatScreen.classList.toggle("active", name === "chat");
  }

  function login() {
    const nick = nickInput.value.trim();
    if (!nick) { setStatus("Avval nik yozing."); return; }
    myNick = nick;
    setStatus("");
    loginBtn.disabled = true;
    loginBtn.textContent = "Ulanmoqda...";

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${proto}://${location.host}/ws`);
    ws = socket;

    socket.onopen = () => socket.send(JSON.stringify({ type: "login", text: nick }));
    socket.onmessage = (e) => { if (ws === socket) handle(JSON.parse(e.data)); };
    socket.onclose = () => {
      if (ws !== socket) return;   // biz o'zimiz yopgan bo'lsak, hech narsa qilmaymiz
      backToLogin(inChat ? "Server bilan aloqa uzildi." : "Serverga ulanib bo'lmadi.");
    };
  }

  function handle(msg) {
    if (!inChat) {
      if (msg.type === "system") enterChat();          // server kirishni qabul qildi
      else { backToLogin(msg.text); return; }          // nik band va h.k.
    }
    addMessage(msg);
  }

  function enterChat() {
    messages.replaceChildren();
    inChat = true;
    showScreen("chat");
    try { localStorage.setItem("linko_nick", myNick); } catch (e) {}
    textInput.focus();
  }

  function backToLogin(text) {
    if (ws) { const s = ws; ws = null; s.close(); }
    inChat = false;
    showScreen("login");
    loginBtn.disabled = false;
    loginBtn.textContent = "Kirish";
    setStatus(text || "");
  }

  function addMessage(m) {
    const mine = m.type === "chat" && m.sender === myNick;
    const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
    const el = document.createElement("div");

    if (m.type === "chat") {
      el.className = "msg " + (mine ? "mine" : "other");
      if (!mine) {
        const name = document.createElement("div");
        name.className = "name"; name.textContent = m.sender;
        el.appendChild(name);
      }
      const body = document.createElement("div");
      body.textContent = m.text;                       // textContent: xavfsiz (HTML ishlamaydi)
      const time = document.createElement("div");
      time.className = "time"; time.textContent = m.time;
      el.append(body, time);
    } else {
      el.className = "sys" + (m.type === "error" ? " err" : "");
      el.textContent = m.text;
    }

    messages.appendChild(el);
    if (mine || nearBottom) messages.scrollTop = messages.scrollHeight;
  }

  function send(text) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "chat", text }));
    }
  }

  loginBtn.addEventListener("click", login);
  nickInput.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  $("who").addEventListener("click", () => send("/kim"));
  $("leave").addEventListener("click", () => backToLogin("Chatdan chiqdingiz."));
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text) return;
    textInput.value = "";
    if (text === "/chiq") backToLogin("Chatdan chiqdingiz.");
    else send(text);
    textInput.focus();
  });
})();
</script>
</body>
</html>
